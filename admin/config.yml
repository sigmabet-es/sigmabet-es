backend:
  name: git-gateway
  branch: main
  identity_url: https://sigmabet.es/.netlify/identity
  gateway_url: https://sigmabet.es/.netlify/git
locale: es
site_url: https://sigmabet.es
display_url: https://sigmabet.es
logo_url: https://sigmabet.es/assets/img/logo.svg
media_folder: assets/img/uploads
public_folder: /assets/img/uploads
collections:
  - name: documentos
    label: Documentación
    files:
      - name: prepartido
        label: Manual prepartido
        file: docs/prepartido.md
        fields:
          - {label: Contenido, name: body, widget: markdown}
