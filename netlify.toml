[[edge_functions]]
  path = "/admin/*"
  function = "private-analyzer"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/privado"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/privado/*"
  to = "/admin/:splat"
  status = 301
