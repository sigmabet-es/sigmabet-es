[[edge_functions]]
  path = "/admin/*"
  function = "private-analyzer"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/privado"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/privado/*"
  to = "/admin/:splat"
  status = 301

# Los antiguos enlaces del estudio llevan ahora al área autenticada.
[[redirects]]
  from = "/material-grafico.html"
  to = "/admin/material-grafico.html"
  status = 302
  force = true

[[redirects]]
  from = "/material-grafico"
  to = "/admin/material-grafico.html"
  status = 302
  force = true

[[headers]]
  for = "/senal-sigma*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
