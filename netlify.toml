[[edge_functions]]
  path = "/privado/*"
  function = "private-analyzer"

[[headers]]
  for = "/privado/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/privado"
  to = "/privado/"
  status = 301

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
